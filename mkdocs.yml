# Návod na docs.fiskus.online (workflow pages.yml). Stránky v docs/ sú
# v dialekte Sourcebook (berie si ich aj platforma fabrikaERP); háčik
# docs_hooks/sourcebook.py ich pri zostavení preloží do MkDocs Material.
site_name: Fiškus
site_url: https://docs.fiskus.online/
site_description: Slovenský účtovný program na štúdium a výučbu účtovníctva.
docs_dir: docs

theme:
  name: material
  custom_dir: docs_theme # farby a písmo Fiškusa
  language: sk
  font: false # písmo z docs_theme/assets/fonts, nič od tretích strán
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - glightbox: # kliknutím sa snímka zväčší
      skip_classes: [no-zoom]

hooks:
  - docs_hooks/sourcebook.py # :::info a ```cards → Material

markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - fenced_code
  - attr_list
  - toc:
      permalink: true

nav:
  - Prehľad: index.md
  - Začíname:
      - zaciname/index.md
      - zaciname/instalacia.md
      - zaciname/uvodne-nastavenie.md
      - zaciname/prenos-dat.md
  - Výučba: vyucba/index.md
  - Predaj:
      - predaj/index.md
      - predaj/faktury.md
      - predaj/zalohy.md
      - predaj/ponuky.md
      - predaj/zakazky.md
      - predaj/prijate-objednavky.md
      - predaj/dodacie-listy.md
      - predaj/upomienky.md
      - predaj/cennik.md
  - Nákup:
      - nakup/index.md
      - nakup/objednavky.md
  - Sklad:
      - sklad/index.md
      - sklad/karta-produktu.md
      - sklad/doklady.md
      - sklad/ocenenie.md
  - Peniaze: peniaze/index.md
  - Dane: dane/index.md
  - Účtovníctvo:
      - uctovnictvo/index.md
      - uctovnictvo/jednoduche.md
      - uctovnictvo/podvojne.md
      - uctovnictvo/majetok.md
  - E-shopy: eshopy/index.md
  - Mzdy: mzdy/index.md
  - Domácnosť: domacnost/index.md
  - Mobil: mobil/index.md
  - Nástroje:
      - nastroje/kalkulacky.md
      - nastroje/tlaciva.md
  - Nastavenia a bezpečnosť: nastavenia/index.md
  - Plán vývoja: ROADMAP.md
  - Prehľad zmien: changelog.md
