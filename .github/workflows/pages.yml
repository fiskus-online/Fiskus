name: Web na Cloudflare

# Tri statické weby na Cloudflare Pages:
#   fiskus.online       ← site/ (verzia a odkazy na inštalátory z posledného vydania)
#   docs.fiskus.online  ← docs/ cez MkDocs
#   app.fiskus.online   ← Fiškus v prehliadači (make browser), iba pri vydaní
# Pri vydaní (tag v* → workflow Release) sa po jeho úspechu nasadia všetky tri.
# Nasadzuje sa, iba keď je v repozitári premenná CLOUDFLARE_ACCOUNT_ID
# a tajomstvo CLOUDFLARE_API_TOKEN (práva Cloudflare Pages: Edit).
# Nič sa neukladá ako artifact — zostavenie aj nahratie sú v jednom kroku.

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'docs_hooks/**', 'docs_theme/**', 'mkdocs.yml', '.github/workflows/pages.yml']
  release:
    types: [published]
  # vydanie vytvára workflow Release (GITHUB_TOKEN), čo udalosť „release“
  # nespustí — preto nasadenie aj po úspešnom Release, či už z tagu v*,
  # alebo spustenom ručne (Run workflow so značkou)
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  site:
    name: fiskus.online
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/check.mjs
      - name: Verzia a odkazy z posledného vydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName || true)
          if [ -n "$tag" ]; then
            v=${tag#v}
            sed -i "s|version: '[^']*'|version: '$v'|; s|downloads: '[^']*'|downloads: 'https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/'|" site/config.js
          fi
          grep -n "version\|downloads" site/config.js
      - name: Nasadenie
        run: |
          npx --yes wrangler@3 pages project list >/dev/null || { echo '::error::Token nemá právo Account › Cloudflare Pages › Edit alebo CLOUDFLARE_ACCOUNT_ID nie je Account ID (nie Zone ID)'; exit 1; }
          npx --yes wrangler@3 pages project create fiskus --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name=fiskus --branch=main --commit-dirty=true

  docs:
    name: docs.fiskus.online
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install "mkdocs<2" mkdocs-material mkdocs-glightbox
      - run: python -m unittest -q test_sourcebook
        working-directory: docs_hooks
      - run: mkdocs build --strict -d _docs
      - name: Nasadenie
        run: |
          npx --yes wrangler@3 pages project list >/dev/null || { echo '::error::Token nemá právo Account › Cloudflare Pages › Edit alebo CLOUDFLARE_ACCOUNT_ID nie je Account ID (nie Zone ID)'; exit 1; }
          npx --yes wrangler@3 pages project create fiskus-docs --production-branch=main || true
          npx --yes wrangler@3 pages deploy _docs --project-name=fiskus-docs --branch=main --commit-dirty=true

  app:
    name: app.fiskus.online (Fiškus v prehliadači)
    # iba vydaná verzia — dáta používateľov sú v prehliadači a prechádzajú
    # migráciami, preto nie každá zmena v main
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # vždy posledné vydanie: pri ručnom Release je head_branch „main“, nie značka
      - name: Vydaná verzia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          [ "$GITHUB_EVENT_NAME" = release ] || tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          git checkout -q "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Fiškus v prehliadači z vydania $tag"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Zostavenie
        run: make browser VERSION="${TAG#v}"
      - name: Nasadenie
        run: |
          npx --yes wrangler@3 pages project list >/dev/null || { echo '::error::Token nemá právo Account › Cloudflare Pages › Edit alebo CLOUDFLARE_ACCOUNT_ID nie je Account ID (nie Zone ID)'; exit 1; }
          npx --yes wrangler@3 pages project create fiskus-app --production-branch=main || true
          npx --yes wrangler@3 pages deploy frontend/dist-browser --project-name=fiskus-app --branch=main --commit-dirty=true
