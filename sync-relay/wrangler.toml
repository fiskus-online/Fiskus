# Schránka synchronizácie Fiškusa — Cloudflare Worker s Durable Objects
# (SQLite). Funguje na bezplatnom pláne Workers, ktorý nič nefakturuje.
name = "fiskus-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "Channel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Channel"]
